<script>
"use strict";
const SIGNALS = __SIGNALS_JSON__;
const TEMPLATES = __TEMPLATES_JSON__;
const APP_VERSION = "1.1.0";
// "claude" when published as a claude.ai artifact; "github" for the GitHub Pages build (set by standalone/build.py)
const HOST = window.TAA_HOST === "github" ? "github" : "claude";

// ------------------------------------------------------------------ utilities
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const nowIso = () => new Date().toISOString();
const reEsc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const norm = (s) => (s || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
const wordReCache = new Map();
function wordRe(t) {
  const k = t.trim();
  if (!wordReCache.has(k)) wordReCache.set(k, new RegExp(`(?<![A-Za-z0-9])${reEsc(k)}(?![A-Za-z0-9])`, "i"));
  return wordReCache.get(k);
}
const titleReCache = new Map();
function titleRe(t) { if (!titleReCache.has(t)) titleReCache.set(t, new RegExp(t, "i")); return titleReCache.get(t); }
function fnv(s) { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(36); }
const idFor = (key) => "c" + fnv(key) + fnv(key.split("").reverse().join(""));
const clone = (o) => JSON.parse(JSON.stringify(o));
const isCurrent = (p) => !p.end || /^(present|current|now)$/i.test(String(p.end).trim());
const fmtDate = (iso) => (iso ? String(iso).replace("T", " ").slice(0, 16) : "");
function seg(score) {
  if (score === null || score === undefined) return '<span class="unk" title="Unknown: no evidence">UNK</span>';
  let cells = ""; for (let i = 0; i < 4; i++) cells += `<i class="${i < score ? "on" : ""}"></i>`;
  return `<span class="seg" title="${score} of 4" aria-label="${score} of 4">${cells}</span>`;
}

// ------------------------------------------------------------------ masking
const EMAIL = /[\w.+-]+@[\w-]+\.[\w.-]+/g;
const URLRE = /(?:https?:\/\/|www\.)\S+|\blinkedin\.com\/\S+/gi;
const PHONE = /(?<!\d)(?:\+?1[\s.-]?)?\(?\d{3}\)?[\s.-]\d{3}[\s.-]\d{4}(?!\d)/g;
function nameParts(full) {
  full = (full || "").trim(); if (!full) return [];
  return [full, ...full.split(/\s+/).map((p) => p.replace(/^[,.]+|[,.]+$/g, "")).filter((p) => p.length >= 3)];
}
function scrub(text, names) {
  if (!text) return "";
  let out = String(text).replace(EMAIL, "[EMAIL]").replace(URLRE, "[URL]").replace(PHONE, "[PHONE]");
  for (const n of [...new Set(names.filter((n) => n.length >= 3))].sort((a, b) => b.length - a.length))
    out = out.replace(new RegExp(`(?<![A-Za-z])${reEsc(n)}(?![A-Za-z])`, "gi"), "[CANDIDATE]");
  return out;
}
// The scorer never sees name, contact details, location, schools or graduation years.
function maskedView(p) {
  const names = nameParts(p.full_name); const s = (t) => scrub(t || "", names).trim();
  const positions = (p.positions || []).map((x, i) => {
    const title = s(x.title), company = s(x.company);
    return { index: i + 1, title, company, header: `${title} | ${company} | ${x.start || "unknown"} to ${x.end || "present"}`, description: s(x.description) };
  });
  const mp = { headline: s(p.headline), summary: s(p.summary), clearance: s(p.clearance), skills: (p.skills || []).map(s).filter(Boolean), positions };
  const lines = [];
  if (mp.headline) lines.push("HEADLINE: " + mp.headline);
  if (mp.summary) lines.push("SUMMARY: " + mp.summary);
  if (mp.clearance) lines.push("CLEARANCE (SELF-REPORTED, UNVERIFIED): " + mp.clearance);
  if (mp.skills.length) lines.push("SKILLS: " + mp.skills.join("; "));
  if (positions.length) { lines.push("EXPERIENCE:"); for (const q of positions) { lines.push(`[${q.index}] ${q.header}`); if (q.description) lines.push(q.description); } }
  mp.text = lines.join("\n");
  mp.sections = [mp.headline, mp.summary, mp.clearance, ...positions.flatMap((q) => [q.header, q.description]), ...mp.skills].filter(Boolean);
  return mp;
}

// ------------------------------------------------------------------ signal dictionary
const STRENGTH = { strong: 3, medium: 2, weak: 1 };
function sentenceAround(text, start, end, limit = 240) {
  const re = /(?<=[.!?;])\s+|\n+/g; let s0 = 0, e0 = text.length, m;
  while ((m = re.exec(text))) {
    if (!m[0].length) { re.lastIndex++; continue; }
    const ms = m.index, me = m.index + m[0].length;
    if (me <= start) s0 = me; else if (ms >= end) { e0 = ms; break; }
  }
  if (e0 - s0 > limit) { s0 = Math.max(s0, start - (limit >> 1)); e0 = Math.min(e0, end + (limit >> 1)); }
  return text.slice(s0, e0).trim();
}
function findKeyword(mp, kw) {
  const rx = wordRe(kw);
  for (const section of mp.sections) { const m = rx.exec(section); if (m) return sentenceAround(section, m.index, m.index + m[0].length); }
  return null;
}
function employerMatch(company, names) { for (const n of names || []) if (n.trim() && wordRe(n).test(company || "")) return n; return null; }
function matchSignal(cid, sig, mp) {
  const found = []; const st = sig.strength || "medium";
  if ((sig.employers || []).length || (sig.title_patterns || []).length) {
    for (const p of mp.positions) {
      let emp = "";
      if ((sig.employers || []).length) { emp = employerMatch(p.company, sig.employers); if (!emp) continue; }
      if ((sig.title_patterns || []).length && !sig.title_patterns.some((t) => titleRe(t).test(p.title))) continue;
      const quote = p.title ? `${p.title} | ${p.company}` : p.company;
      if ((sig.keywords || []).length) {
        let kq = null;
        outer: for (const kw of sig.keywords) for (const src of [p.description, p.title]) {
          const m = wordRe(kw).exec(src); if (m) { kq = sentenceAround(src, m.index, m.index + m[0].length); break outer; }
        }
        if (!kq) continue;
        found.push({ cap: cid, strength: st, quote }, { cap: cid, strength: st, quote: kq });
      } else found.push({ cap: cid, strength: st, quote });
    }
  } else {
    for (const kw of sig.keywords || []) { const q = findKeyword(mp, kw); if (q) found.push({ cap: cid, strength: st, quote: q }); }
  }
  return found;
}
function matchSignals(mp, caps) {
  const out = [];
  for (const [cid, cap] of Object.entries(SIGNALS.capabilities || {})) {
    if (caps && !caps.includes(cid)) continue;
    for (const sig of cap.signals || []) out.push(...matchSignal(cid, sig, mp));
  }
  return out;
}

// ------------------------------------------------------------------ heuristic scorer
const NUM = "(\\d{1,3}(?:,\\d{3})*|\\d+)";
const TEAM = [
  "\\b(?:led|lead|leading|manag(?:e|ed|es|ing)|built|grew|scaled|oversaw|oversee|oversees|direct(?:ed|s|ing)?|ran|run|runs)\\b[^.\\n;]{0,60}?\\b" + NUM +
    "\\+?\\s*(?:-\\s*person|person|people|engineers|developers|staff|employees|software engineers|engineering staff|team members|FTEs?)\\b",
  "\\b(?:team|org|organization|organisation|department|group|workforce) of\\s+" + NUM + "\\+?",
  "\\b" + NUM + "\\+?\\s*(?:-\\s*person|person)\\s+(?:team|org|organization|engineering)",
];
function teamSize(mp) {
  let best = null;
  for (const section of mp.sections) for (const src of TEAM) {
    const rx = new RegExp(src, "gi"); let m;
    while ((m = rx.exec(section))) {
      const n = parseInt(m[1].replace(/,/g, ""), 10);
      if (!best || n > best[0]) best = [n, sentenceAround(section, m.index, m.index + m[0].length)];
    }
  }
  return best;
}
const teamScore = (n) => (n >= 100 ? 4 : n >= 50 ? 3 : n >= 20 ? 2 : n >= 5 ? 1 : 0);
function heuristicCard(rubric, mp) {
  const caps = [...new Set(rubric.criteria.flatMap((c) => c.signals || []))];
  const matches = caps.length ? matchSignals(mp, caps) : [];
  const scores = rubric.criteria.map((c) => {
    const hits = [];
    for (const m of matches) if ((c.signals || []).includes(m.cap)) hits.push([STRENGTH[m.strength], m.quote, `${m.cap} (${m.strength})`]);
    for (const kw of c.keywords || []) { const q = findKeyword(mp, kw); if (q) hits.push([2, q, `keyword '${kw}'`]); }
    if (c.heuristic === "team_size") { const ts = teamSize(mp); if (ts) hits.push([teamScore(ts[0]), ts[1], `team size ${ts[0]}`]); }
    if (!hits.length) return { criterion_id: c.id, score: null, evidence: [], rationale: "No matching evidence found.", removed_quotes: 0 };
    hits.sort((a, b) => b[0] - a[0]);
    let best = hits[0][0];
    const strong = new Set(hits.filter((h) => h[0] >= 3).map((h) => h[1]));
    if (best === 3 && strong.size >= 2) best = 4;
    const evidence = [];
    for (const h of hits) { if (!evidence.includes(h[1])) evidence.push(h[1]); if (evidence.length === 3) break; }
    const why = [...new Set(hits.map((h) => h[2]))].sort().slice(0, 4);
    return { criterion_id: c.id, score: best, evidence, rationale: "Matched " + why.join(", ") + ".", removed_quotes: 0 };
  });
  const known = scores.filter((s) => s.score !== null).length;
  return { scores, summary: `Signal match on ${known} of ${scores.length} criteria.`, scorer: "heuristic", notes: [] };
}

// ------------------------------------------------------------------ evidence verification
function normalizeQ(t) {
  t = String(t).replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/[–—]/g, "-").replace(/ /g, " ")
    .replace(/\s+/g, " ").trim().toLowerCase();
  t = t.replace(/^["'` ]+|["'` ]+$/g, "").replace(/^(\.\.\.|…)\s*|\s*(\.\.\.|…)$/g, "");
  return t.replace(/[ .,;:]+$/, "");
}
// Every quote must appear in the masked profile; a criterion left with no verified quote becomes unknown.
function applyVerification(card, sourceText) {
  const hay = normalizeQ(sourceText);
  card.scores = card.scores.map((s) => {
    const kept = []; let removed = 0;
    for (const q of s.evidence || []) {
      const n = normalizeQ(q);
      if (n.length >= 2 && hay.includes(n)) { const t = String(q).trim(); if (!kept.includes(t)) kept.push(t); } else removed++;
    }
    let score = s.score ?? null, rationale = s.rationale || "";
    if (score !== null && !kept.length) {
      score = null;
      if (removed) rationale = (rationale ? rationale + " " : "") + "Evidence could not be verified in the profile; marked unknown.";
    }
    return { ...s, score, evidence: kept, rationale, removed_quotes: (s.removed_quotes || 0) + removed };
  });
  return card;
}

// ------------------------------------------------------------------ ranking (computed in code, never by a model)
function totals(card, rubric) {

  if (excluded.length) h += `<h2>Excluded before scoring</h2><p class="caption">Hard filters: the do-not-target list and the rubric's location gate.</p><div class="table-wrap"><table><thead><tr><th>Candidate</th><th>Reason</th></tr></thead><tbody>
    ${excluded.map((c) => `<tr><td>${esc(c.profile.full_name || c.key)}</td><td>${esc(c.exclusionReason)}</td></tr>`).join("")}</tbody></table></div>`;
  h += `<h2>Inputs</h2><div class="table-wrap"><table><thead><tr><th>File</th><th class="num">Records</th></tr></thead><tbody>${(s.inputs || []).map((i) => `<tr><td>${esc(i.name)}</td><td class="num">${esc(i.count)}</td></tr>`).join("")}</tbody></table></div>`;
  h += `<h2>Sourcing queries</h2>${planHtml(r, false)}`;

}
async function scoreSearch(sid, mode) {
  const s = app.searches.find((x) => x.id === sid); if (!s || !app.sample || app.scoring) return;
  const r = s.rubric, n = Math.max(1, Math.min(200, parseInt(document.getElementById("sc_n").value, 10) || 50));
  const tier = document.getElementById("sc_tier").value === "complex" ? "complex" : "default";
  const list = ranked([...app.cands.values()]);
  const targets = (mode === "all" ? list : list.filter((c) => c.card.scorer === "heuristic")).slice(0, n);
  if (!targets.length) return say("Claude scoring", "Every candidate in range already has a Claude score.");
  const ctl = new AbortController();
  app.scoring = { sid, done: 0, total: targets.length, msg: "Waiting for Claude. The first batch can take a minute.", ctl };
  render();
  let failures = 0, refusedBatches = 0;
  for (let i = 0; i < targets.length && !ctl.signal.aborted; i += 5) {
    const batch = targets.slice(i, i + 5).map((c, j) => ({ c, ref: "p" + (j + 1), mp: maskedView(c.profile) }));
    try {
      const opts = { modelTier: tier, signal: ctl.signal };
      if (HOST === "github") opts.jsonSchema = scoringSchema(r, batch.map((b) => b.ref));
      const res = await app.sample.json(scoringPrompt(r, batch.map((b) => ({ ref: b.ref, text: b.mp.text }))), opts);
      const arr = Array.isArray(res) ? res : Array.isArray(res?.candidates) ? res.candidates : [];
      for (const b of batch) {
        const item = arr.find((x) => x && String(x.candidate) === b.ref);
        if (!item) continue;
        const byId = {};
        for (const it of item.criteria || []) if (it && r.criteria.some((c) => c.id === it.criterion_id) && !byId[it.criterion_id]) {
          const unknown = it.status !== "scored";
          byId[it.criterion_id] = { criterion_id: it.criterion_id, score: unknown ? null : Math.max(0, Math.min(4, parseInt(it.score, 10) || 0)),
            evidence: unknown ? [] : (it.evidence || []).map(String).slice(0, 5), rationale: String(it.rationale || "").slice(0, 600), removed_quotes: 0 };
        }
        const card = applyVerification({ scores: r.criteria.map((c) => byId[c.id] || { criterion_id: c.id, score: null, evidence: [], rationale: "Claude returned no score for this criterion.", removed_quotes: 0 }),
          summary: String(item.summary || "").slice(0, 400), scorer: `claude (${tier} tier)`, notes: [`scored ${nowIso().slice(0, 10)}`] }, b.mp.text);
        await app.db.doc(`searches/${sid}/candidates/${b.c.id}`).update({ card, ...totals(card, r) });
      }
      failures = 0;
    } catch (e) {
      if (e && e.code === "cancelled") break;
      if (e && ["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(e.code)) { app.scoring = null; return say("Claude scoring", "Claude is not allowed for this app in your account. Heuristic scores remain."); }
      if (e && e.code === "rate_limited") { app.scoring = null; await finishScoring(sid, tier); return say("Claude scoring", "Your Claude usage limit or rate limit was reached. Scored candidates are saved; run it again later to finish."); }
      if (e && e.code === "refused") refusedBatches++;
      failures++;
      if (failures >= 2) { app.scoring = null; await finishScoring(sid, tier); return say("Claude scoring", "Two batches in a row failed (" + (e.code || "error") + "). Scored candidates are saved; try again later."); }
    }
    app.scoring.done = Math.min(targets.length, i + 5);
    app.scoring.msg = `Scored ${app.scoring.done} of ${targets.length}`;
    render();
  }
  app.scoring = null;
  await finishScoring(sid, tier);
  if (refusedBatches) say("Claude scoring", `${refusedBatches} batch(es) were declined by Claude and keep heuristic scores.`);
  else render();
}
async function finishScoring(sid, tier) {
  try { await app.db.doc(`searches/${sid}`).update({ stats: { scorer: `claude (${tier} tier)` } }); } catch {}
  await audit("search.scored", sid, { tier });
}
async function exportCsv(sid) {
  const s = app.searches.find((x) => x.id === sid); if (!s) return;

  const q = (v) => { v = String(v ?? ""); return /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
  const rows = [["rank", "name", "headline", "location", "current_title", "current_company", "linkedin_url", "total", "coverage", "requirement_unknowns",
    ...r.criteria.map((c) => c.id + "_score"), ...r.criteria.map((c) => c.id + "_evidence"), "flags", "scorer", "review", "review_reason", "key"]];
  list.forEach((c, i) => {

  });
  const csv = rows.map((row) => row.map(q).join(",")).join("\n");
  if (!app.downloads) return say("Export", "Downloads are not available in this view.");
  try { await app.downloads.save({ filename: `astrion-slate-${s.title.replace(/[^A-Za-z0-9]+/g, "-").slice(0, 40)}.csv`, data: csv }); await audit("search.exported", sid, { rows: list.length }); }

async function review(sid, cid, decision) {
  const reason = document.getElementById(decision === "approve" ? "rv_ok" : "rv_no").value;
  const note = document.getElementById("rv_note").value.trim().slice(0, 2000);
  try {
    await app.db.doc(`searches/${sid}/candidates/${cid}`).update({ review: { decision, reason, note, by: app.me?.id || null, at: nowIso() } });
    await audit("candidate.reviewed", sid, { candidate: cid, decision, reason });
    const s = app.searches.find((x) => x.id === sid);
    const approved = [...app.cands.values()].filter((c) => !c.excluded && (c.id === cid ? decision === "approve" : c.review?.decision === "approve")).length;
    if (s) await app.db.doc(`searches/${sid}`).update({ stats: { approved } });
    document.getElementById("rv_note").value = "";
    const list = ranked([...app.cands.values()]); const idx = list.findIndex((x) => x.id === cid);
    const next = list.slice(idx + 1).find((x) => !x.review && x.id !== cid);
    location.hash = next ? `#cand-${sid}-${next.id}` : `#search-${sid}`;
  } catch (e) { say("Review", e && e.code === "invalid_argument" ? "You do not have write access. Ask the owner for Contributor access." : "The review was not saved (" + (e.code || "error") + ")."); }
}
async function outreach(sid, cid) {
  const s = app.searches.find((x) => x.id === sid), c = app.cands.get(cid); if (!s || !c) return;
  const r = s.rubric, out = document.getElementById("or_status");
  const ev = [...r.criteria].sort((a, b) => b.weight - a.weight).map((cr) => { const x = c.card.scores.find((y) => y.criterion_id === cr.id); return x && x.score && x.evidence.length ? `${cr.name}: ${x.evidence[0]}` : null; }).filter(Boolean).slice(0, 4);
  let text;
  if (app.sample) {
    out.textContent = "Thinking";
    try {
      const res = await app.sample(`${OUTREACH_RULES}\n\nROLE: ${r.title}\nROLE PITCH: ${r.role_pitch || r.summary}\nVERIFIED EVIDENCE FROM THE CANDIDATE'S PROFILE:\n${ev.map((e) => "- " + e).join("\n")}\n\nDraft the message.`, { cache: false });
      text = res.text.trim().replace(/—/g, ", ");
    } catch (e) { if (e && e.code === "cancelled") return; out.textContent = "Claude did not draft it (" + (e.code || "error") + "). A template draft is shown."; }
  }
  if (!text) {
    const quote = ev.length ? ev[0].split(": ").slice(1).join(": ").trim().replace(/\.$/, "") : "";
    text = `Hi [First name],\n\n${quote ? `Your background caught my attention, in particular this from your profile: "${quote}."` : "Your background caught my attention."} ${r.role_pitch || `Astrion is hiring a ${r.title}.`}\n\nWould you be open to a 20-minute call in the next week or two to hear more?\n\n[Recruiter name]`;
  }
  try { await app.db.doc(`searches/${sid}/candidates/${cid}`).update({ outreach: text }); await audit("outreach.drafted", sid, { candidate: cid }); }
  catch (e) { say("Outreach", "The draft was not saved (" + (e.code || "error") + ")."); }
}

    <div class="row"><button class="btn" data-act="saveKey">Save key</button>${storedKey() ? `<button class="btn btn-quiet" data-act="clearKey">Remove key</button>` : ""}<span class="caption" id="key_status">${storedKey() ? "A key is saved." : "No key saved."}</span></div></section>` :
  `<section class="panel"><h3>Access</h3>
    <p>Candidate data is readable only at Contributor level or above. People who open a public link from outside Astrion's Claude organization see no data.</p>
    <p class="caption">Owner and Editors change the do-not-target list and delete searches. Contributors run searches and review candidates.</p></section>`}
  <section class="panel"><h3>Do-not-target list</h3><p class="caption">Owned by Contracts: non-solicitation terms from teaming agreements, subcontracts and NDAs. Candidates whose current employer matches are excluded before scoring.</p>
    <div class="field"><label for="dnt_yaml">Employers (YAML)</label><textarea id="dnt_yaml" class="code" style="min-height:200px" ${app.isAdmin ? "" : "readonly"}>${esc(dntYaml)}</textarea>
    <p class="hint">Each entry: name, aliases, reason, lookback_months. ${app.isAdmin ? "" : "Only Editors and the owner can change this list."}</p></div>
    ${app.isAdmin ? `<button class="btn" data-act="saveDnt">Save list</button> <span class="caption" id="dnt_status"></span>` : ""}</section></div>
  <h2>Retention</h2><p>Delete searches you no longer need, including their candidate records. Storage holds about 25,000 records in total.</p>
  <div class="table-wrap"><table><thead><tr><th>Search</th><th>Created</th><th class="num">Records</th><th></th></tr></thead><tbody>
  ${app.searches.map((s) => `<tr><td>${esc(s.title)}</td><td class="mono">${esc(fmtDate(s.createdAt))}</td><td class="num">${esc((s.stats?.kept || 0) + (s.stats?.excluded || 0))}</td>
    <td>${app.isAdmin ? `<button class="btn btn-quiet" data-act="delSearch" data-sid="${esc(s.id)}" style="min-height:28px">Delete</button>` : ""}</td></tr>`).join("") || `<tr><td colspan="4" class="muted">No searches.</td></tr>`}
  </tbody></table></div>
  <h2>Audit log</h2><div id="auditBox"><p class="muted">Loading</p></div>`;
}
async function loadAudit() {
  const box = document.getElementById("auditBox"); if (!box || !app.db) return;
  try {
    const snap = await app.db.collection("audit").orderBy("ts", "desc").limit(200).get();
    const rows = snap.docs.map((d) => d.data()); const nm = await names(rows.map((x) => x.by));
    box.innerHTML = `<div class="table-wrap"><table><thead><tr><th>Time (UTC)</th><th>Who</th><th>Action</th><th>Detail</th></tr></thead><tbody>
      ${rows.map((x) => `<tr><td class="mono">${esc(fmtDate(x.ts))}</td><td>${esc(nm[x.by] || "Someone")}</td><td class="mono">${esc(x.action)}</td><td class="mono" style="font-size:8pt">${esc(JSON.stringify(x.detail || {}))}</td></tr>`).join("") || `<tr><td colspan="4" class="muted">No events yet.</td></tr>`}
      </tbody></table></div>`;
  } catch (e) { box.innerHTML = `<p class="muted">The audit log is not available (${esc(e.code || "error")}).</p>`; }
}

// ---- after-render wiring that needs the DOM
async function hydrate(route) {
  if (route === "new-search") {
    const sel = document.getElementById("ns_rubric"), plan = document.getElementById("ns_plan");
    const show = () => { const r = app.rubrics.find((x) => x.id === sel.value); if (r) plan.innerHTML = planHtml(r.rubric); };
    if (sel) { sel.onchange = () => { const r = app.rubrics.find((x) => x.id === sel.value); if (r) document.getElementById("ns_title").value = r.title + " search"; show(); }; show(); }
    const f = document.getElementById("newSearchForm"); if (f) f.onsubmit = (e) => { e.preventDefault(); createSearch(f); };
  }
  if (route === "governance") loadAudit();
  const nameEls = document.querySelectorAll("[data-name]");
  if (nameEls.length) { const nm = await names([...nameEls].map((el) => el.dataset.name)); nameEls.forEach((el) => { if (el.dataset.name) el.textContent = `by ${nm[el.dataset.name] || "Someone"}, ${el.textContent}`; el.removeAttribute("data-name"); }); }
}

// ------------------------------------------------------------------ light and dark mode
const SUN = '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6 13 13M3 13l1.4-1.4M11.6 4.4 13 3" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>';
const MOON = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 10.2A6 6 0 0 1 5.8 2.5a6 6 0 1 0 7.7 7.7Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>';
const lightQuery = window.matchMedia ? window.matchMedia("(prefers-color-scheme: light)") : null;
function themeNow() {
  const t = document.documentElement.getAttribute("data-theme");
  return t === "light" || t === "dark" ? t : lightQuery && lightQuery.matches ? "light" : "dark";
}
function paintThemeToggle() {
  const b = document.getElementById("themeToggle"); if (!b) return;
  const next = themeNow() === "dark" ? "light" : "dark";
  b.innerHTML = (next === "light" ? SUN : MOON) + `<span>${next === "light" ? "Light mode" : "Dark mode"}</span>`;
  b.setAttribute("aria-label", `Switch to ${next} mode`);
}
document.getElementById("themeToggle").addEventListener("click", () => {
  const next = themeNow() === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("taa:theme", next); } catch (e) { /* the choice still applies for this visit */ }
  paintThemeToggle();
});
if (lightQuery && lightQuery.addEventListener) lightQuery.addEventListener("change", paintThemeToggle);
// The claude.ai viewer can also set data-theme on this page; keep the label in step with it
new MutationObserver(paintThemeToggle).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
paintThemeToggle();

// ------------------------------------------------------------------ actions
const pendingDelete = new Set();
document.addEventListener("click", async (ev) => {
  const t = ev.target.closest("[data-act]"); if (!t) return;
  const act = t.dataset.act;
  if (act === "dismiss") { app.flash = null; return render(); }
  if (act === "export") return exportCsv(t.dataset.sid);
  if (act === "score") return scoreSearch(t.dataset.sid, t.dataset.mode);
  if (act === "stop") { app.scoring?.ctl.abort(); return; }
  if (act === "review") return review(t.dataset.sid, t.dataset.cid, t.dataset.decision);
  if (act === "outreach") { t.disabled = true; await outreach(t.dataset.sid, t.dataset.cid); t.disabled = false; return; }
  if (act === "addTemplate") {
    try { const id = await saveRubricDraft(clone(TEMPLATES[+t.dataset.i]), "template"); location.hash = "#rubric-" + id; }
    catch (e) { say("Rubric", "Not saved: " + (e.message || e.code)); } return;
  }
  if (act === "pasteYaml") {
    const st = document.getElementById("py_status");
    try { const id = await saveRubricDraft(jsyaml.load(document.getElementById("yaml_new").value), "manual"); location.hash = "#rubric-" + id; }
    catch (e) { st.textContent = "Not saved: " + (e.message || e.code); } return;
  }
  if (act === "intake") {
    const st = document.getElementById("in_status"), text = document.getElementById("in_text").value.trim();
    if (!text) return (st.textContent = "Paste a hiring request first.");
    t.disabled = true; st.textContent = "Claude is drafting. This can take a minute.";
    try {
      const d = await app.sample.json(intakePrompt(text), { modelTier: "default", cache: false });
      const crit = (d.criteria || []).map((c, i) => ({ ...c, id: (String(c.id || c.name || "c" + i).toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "") || "c" + i).replace(/^(\d)/, "c_$1"),
        signals: (c.signals || []).filter((s) => (SIGNALS.capabilities || {})[s]), weight: Math.max(1, parseInt(c.weight, 10) || 10) }));
      const tw = crit.reduce((a, c) => a + c.weight, 0) || 1; crit.forEach((c) => (c.weight = Math.max(1, Math.round((100 * c.weight) / tw))));
      const obj = { id: (String(d.id || d.title || "role").toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "") || "role").replace(/^(\d)/, "r_$1"), version: 1,
        title: d.title || "Untitled role", summary: d.summary || "", role_pitch: d.role_pitch || "", target_titles: d.target_titles || [], target_companies: d.target_companies || [],
        gates: { locations: d.locations || [] }, criteria: crit };
      const id = await saveRubricDraft(obj, "intake"); location.hash = "#rubric-" + id;
    } catch (e) { st.textContent = "Not drafted: " + (e.message || e.code || "error"); }
    finally { t.disabled = false; } return;
  }
  if (act === "saveRubric") {
    const row = app.rubrics.find((x) => x.id === t.dataset.id), st = document.getElementById("re_status");
    let obj; try { obj = jsyaml.load(document.getElementById("yaml_edit").value); } catch (e) { return (st.textContent = "Not saved: " + e.message); }
    const errs = validateRubric(obj); if (errs.length) return (st.textContent = "Not saved: " + errs.join(" "));
    try {
      if (row.status === "approved") { const id = await saveRubricDraft(obj, "edit"); location.hash = "#rubric-" + id; return; }
      const r = normalizeRubric(obj); r.version = row.version;
      await app.db.doc(`rubrics/${row.id}`).update({ title: r.title, rubric: r, yaml: document.getElementById("yaml_edit").value });
      await audit("rubric.edited", null, { rubric: row.slug, version: row.version }); st.textContent = "Saved.";
    } catch (e) { st.textContent = "Not saved (" + (e.code || e.message) + ")."; } return;
  }
  if (act === "approve") {
    const st = document.getElementById("ap_status"), who = document.getElementById("approver").value.trim();
    if (!who) return (st.textContent = "Enter the approver's name.");
    try { await app.db.doc(`rubrics/${t.dataset.id}`).update({ status: "approved", approvedBy: who.slice(0, 120), approvedById: app.me?.id || null, approvedAt: nowIso() });
      const row = app.rubrics.find((x) => x.id === t.dataset.id); await audit("rubric.approved", null, { rubric: row?.slug, version: row?.version, approver: who }); }
    catch (e) { st.textContent = "Not approved (" + (e.code || e.message) + ")."; } return;
  }
  if (act === "saveKey" || act === "clearKey") {
    const v = act === "clearKey" ? "" : document.getElementById("api_key").value.trim();
    if (act === "saveKey" && !v) { document.getElementById("key_status").textContent = "Enter a key first."; return; }
    storeKey(v, act === "saveKey" && document.getElementById("api_remember").checked);
    app.sample = localSample(); sdkCache = null;
    say("Claude access", v ? "Key saved in this browser. Claude scoring is on." : "Key removed. Claude scoring is off.");
    return;
  }
  if (act === "saveDnt") {
    const st = document.getElementById("dnt_status");
    try { const o = jsyaml.load(document.getElementById("dnt_yaml").value) || {}; const employers = (o.employers || []).filter((e) => e && e.name).map((e) => ({ name: String(e.name),
        aliases: (e.aliases || []).map(String), reason: String(e.reason || "Non-solicitation obligation"), lookback_months: parseInt(e.lookback_months, 10) || 0 }));
      await app.db.doc("config/dnt").set({ employers, updatedBy: app.me?.id || null, updatedAt: nowIso() }); await audit("dnt.updated", null, { entries: employers.length }); st.textContent = "Saved.";
    } catch (e) { st.textContent = "Not saved: " + (e.message || e.code); } return;
  }
  if (act === "delSearch") {
    const sid = t.dataset.sid;
    if (!pendingDelete.has(sid)) { pendingDelete.add(sid); t.textContent = "Confirm delete"; return; }
    t.disabled = true; t.textContent = "Deleting";
    try { const snap = await app.db.collection(`searches/${sid}/candidates`).get(); for (const d of snap.docs) await app.db.doc(`searches/${sid}/candidates/${d.id}`).delete();
      await app.db.doc(`searches/${sid}`).delete(); await audit("search.deleted", sid, { records: snap.size }); }
    catch (e) { say("Retention", "Delete failed (" + (e.code || "error") + ")."); } return;
  }
});
window.addEventListener("hashchange", () => { app.flash = null; render(); window.scrollTo(0, 0); });
init();
</script>
